# RNS-MFD1 -> Android Auto button bridge  (/etc/rnsaa.conf)
# Restart after changes:  sudo systemctl restart rnsaa

[can]
channel = can0
# seconds a button must be held to count as a long press
long_press = 0.4
# text on the instrument cluster instead of TV/VIDEO (8 characters per line)
fis = true
fis_line1 = Android
fis_line2 = Auto
# true: artist / song of the phone's music instead of the two lines above
fis_nowplaying = false

[buttons]
# <button> = action               (rotary knob)
# <button>.short / <button>.long = action
# buttons: knob_left knob_right  ok (right knob press)  exit (arrow next to NAVI)
#          as scan prev (<) next (>)  key1 .. key6 (presets, short only)
# actions: rotary_left rotary_right select back home up down left right
#          play pause play_pause next prev voice call end_call navigation none
knob_left = rotary_left
knob_right = rotary_right
ok.short = select
ok.long = voice
exit.short = back
exit.long = home
as.short = voice
scan.short = play_pause
scan.long = navigation
prev.short = prev
prev.long = left
next.short = next
next.long = right
key1.short = call
key2.short = end_call
key3.short = home
key4.short = up
key5.short = down
key6.short = navigation

